name: Bug report
description: Report incorrect PortWatch behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove private paths and sensitive process details before submitting.
  - type: input
    id: version
    attributes:
      label: PortWatch version
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS Apple Silicon, macOS Intel, Windows, Linux]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include expected behavior and minimal reproduction steps.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Relevant context
      description: OS version, Linux desktop environment, and safe diagnostic details.
