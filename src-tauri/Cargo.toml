[package]
name = "portwatch"
version = "0.1.0"
description = "A small desktop utility for finding occupied ports"
authors = ["PortWatch contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "portwatch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
netstat2 = "0.11.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tauri = { version = "2", features = ["tray-icon"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
